{% extends "base.html" %}
{% block title %}Edit Note · Secure Notes{% endblock %}
{% block content %}
<div class="page-heading compact">
    <div><span class="eyebrow">KNOWLEDGE BASE</span><h1>Edit note</h1><p>Update the selected study material.</p></div>
    <a class="btn btn-secondary" href="/dashboard">← Back</a>
</div>
<div class="editor-layout">
    <form method="POST" class="panel form-stack">
        <div class="field">
            <label for="title">Note title</label>
            <input type="text" id="title" name="title" value="{{ note['title'] }}" required>
        </div>
        <div class="field">
            <label for="category">Category</label>
            <input type="text" id="category" name="category" value="{{ note['category'] or '' }}">
        </div>
        <div class="field">
            <label for="content">Note content</label>
            <textarea id="content" name="content" rows="14" required>{{ note['content'] }}</textarea>
        </div>
        <div class="form-actions">
            <a class="btn btn-secondary" href="/dashboard">Cancel</a>
            <button class="btn btn-primary" type="submit">Update Note <span>✓</span></button>
        </div>
    </form>
</div>
{% endblock %}
